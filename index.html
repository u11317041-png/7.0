<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雙語互動繪本 - 幫小熊買水果</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        .font-en-storybook { font-family: 'Fredoka', sans-serif; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes popIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        @keyframes pageFlip {
            0% { transform: rotateY(0deg); opacity: 1; }
            50% { transform: rotateY(-90deg); opacity: 0.5; }
            100% { transform: rotateY(0deg); opacity: 1; }
        }
        @keyframes confettiFall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .animate-pop-in { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-page-flip { animation: pageFlip 0.6s ease-in-out forwards; transform-style: preserve-3d; }
        .animate-confetti { animation: confettiFall linear forwards; position: absolute; z-index: 60; }
        
        .storybook-shadow {
            box-shadow: 0 30px 60px -12px rgba(139, 92, 26, 0.25), 
                        0 18px 36px -18px rgba(0, 0, 0, 0.3), 
                        inset 0 0 20px rgba(0,0,0,0.02);
        }
        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-[#FDF8E7] min-h-screen flex items-center justify-center p-4">
    <div id="root" class="w-full max-w-5xl"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Confetti = () => {
            const pieces = Array.from({ length: 30 }).map((_, i) => ({
                id: i, left: `${Math.random() * 100}%`,
                animationDuration: `${Math.random() * 1.5 + 1.5}s`,
                animationDelay: `${Math.random() * 0.2}s`,
                backgroundColor: ['#FF3D00', '#FFD600', '#4CAF50', '#2196F3', '#9C27B0', '#FF9800'][Math.floor(Math.random() * 6)]
            }));
            return (
                <div className="absolute inset-0 pointer-events-none overflow-hidden z-40 rounded-[24px]">
                    {pieces.map(p => (
                        <div key={p.id} className="absolute top-[-20px] w-2.5 h-3.5 animate-confetti rounded-sm shadow-sm"
                            style={{ left: p.left, backgroundColor: p.backgroundColor, animationDuration: p.animationDuration, animationDelay: p.animationDelay }}
                        />
                    ))}
                </div>
            );
        };

        const COLOR_LEVELS = [
            { id: 1, targetColors: ['#FF3D00'], objectName: { zh: '蘋果', en: 'Apple' }, emoji: '🍎',
              storyZh: '熊媽媽想做蘋果派，請小熊去買紅色的蘋果。', storyEn: 'Mama Bear wants to make a pie. She asked Little Bear to buy red apples.',
              path: "M 100 50 C 130 40 160 60 150 110 C 140 160 115 170 100 160 C 85 170 60 160 50 110 C 40 60 70 40 100 50 Z" },
            { id: 2, targetColors: ['#4CAF50'], objectName: { zh: '樹葉', en: 'Leaf' }, emoji: '🌿',
              storyZh: '蘋果上需要有新鮮的綠色樹葉！', storyEn: 'The apples need fresh green leaves on them!',
              path: "M100 20 C130 50 150 110 100 180 C50 110 70 50 100 20 Z" },
            { id: 3, targetColors: ['#FFD600'], objectName: { zh: '香蕉', en: 'Banana' }, emoji: '🍌',
              storyZh: '接著，熊媽媽請小熊尋找甜甜的黃色香蕉。', storyEn: 'Next, Mama Bear asked Little Bear to find sweet yellow bananas.',
              path: "M 45 145 C 65 185 140 175 165 105 C 135 145 85 145 55 125 Z" },
            { id: 4, targetColors: ['#FF9800'], objectName: { zh: '橘子', en: 'Orange' }, emoji: '🍊',
              storyZh: '小熊還需要買多汁的橘色橘子！', storyEn: 'Little Bear also needs to buy juicy orange oranges!',
              path: "M100 35 C145 35 170 65 170 105 C170 150 140 175 100 175 C60 175 30 150 30 105 C30 65 55 35 100 35 Z" },
            { id: 5, targetColors: ['#9C27B0'], objectName: { zh: '葡萄', en: 'Grapes' }, emoji: '🍇',
              storyZh: '最後是熊媽媽最喜歡的紫色葡萄。', storyEn: 'Finally, Mama Bear\'s favorite purple grapes.',
              path: "M 71 85 a 14 14 0 1 0 28 0 a 14 14 0 1 0 -28 0 M 101 85 a 14 14 0 1 0 28 0 a 14 14 0 1 0 -28 0 M 61 110 a 14 14 0 1 0 28 0 a 14 14 0 1 0 -28 0 M 111 110 a 14 14 0 1 0 28 0 a 14 14 0 1 0 -28 0 M 71 135 a 14 14 0 1 0 28 0 a 14 14 0 1 0 -28 0 M 101 135 a 14 14 0 1 0 28 0 a 14 14 0 1 0 -28 0 M 86 75 a 14 14 0 1 0 28 0 a 14 14 0 1 0 -28 0 M 86 100 a 14 14 0 1 0 28 0 a 14 14 0 1 0 -28 0 M 86 125 a 14 14 0 1 0 28 0 a 14 14 0 1 0 -28 0 M 86 150 a 14 14 0 1 0 28 0 a 14 14 0 1 0 -28 0" }
        ];

        // 更新樹上的水果名單：蘋果、櫻桃、檸檬、芒果、橘子
        const COUNT_LEVELS = [
            { id: 1, targetCount: 3, emoji: '🍎', objectName: { zh: '蘋果', en: 'apples' },
              storyZh: '小熊來到果園，請幫他把 3 顆蘋果放進籃子！', storyEn: 'Help Little Bear put 3 apples into the basket!',
              positions: [ {x:20, y:15}, {x:45, y:10}, {x:70, y:15}, {x:15, y:35}, {x:38, y:28}, {x:60, y:25}, {x:78, y:35}, {x:28, y:48}, {x:50, y:46}, {x:72, y:48} ] },
            { id: 2, targetCount: 4, emoji: '🍒', objectName: { zh: '櫻桃', en: 'cherries' },
              storyZh: '樹上長滿了小櫻桃！請幫忙採 4 串櫻桃。', storyEn: 'The tree is full of little cherries! Please pick 4 cherries.',
              positions: [ {x:22, y:18}, {x:48, y:12}, {x:72, y:18}, {x:12, y:38}, {x:36, y:32}, {x:58, y:28}, {x:80, y:38}, {x:26, y:50}, {x:48, y:48}, {x:74, y:52} ] },
            { id: 3, targetCount: 6, emoji: '🍋', objectName: { zh: '檸檬', en: 'lemons' },
              storyZh: '哇，好酸的檸檬！請幫忙收集 6 顆檸檬。', storyEn: 'Wow, sour lemons! Please collect 6 lemons.',
              positions: [ {x:18, y:16}, {x:42, y:8}, {x:68, y:14}, {x:16, y:32}, {x:38, y:26}, {x:62, y:22}, {x:82, y:30}, {x:28, y:46}, {x:52, y:42}, {x:76, y:46} ] },
            { id: 4, targetCount: 5, emoji: '🥭', objectName: { zh: '芒果', en: 'mangoes' },
              storyZh: '樹上結了香甜的芒果，小熊需要 5 顆。', storyEn: 'Sweet mangoes! Little Bear needs 5 mangoes.',
              positions: [ {x:25, y:20}, {x:55, y:10}, {x:75, y:25}, {x:15, y:40}, {x:35, y:30}, {x:65, y:35}, {x:85, y:45}, {x:30, y:50}, {x:50, y:48}, {x:70, y:52} ] },
            { id: 5, targetCount: 4, emoji: '🍊', objectName: { zh: '橘子', en: 'oranges' },
              storyZh: '最後，請幫小熊收集 4 顆橘子帶回家！', storyEn: 'Lastly, help Little Bear collect 4 oranges!',
              positions: [ {x:24, y:16}, {x:50, y:12}, {x:70, y:20}, {x:18, y:38}, {x:40, y:28}, {x:60, y:32}, {x:78, y:40}, {x:30, y:52}, {x:52, y:46}, {x:72, y:54} ] }
        ];

        // 配合數學關卡的水果調整
        const MATH_LEVELS = [
            { id: 1, fruit: '🍎', type: '+', a: 2, b: 1, options: [2, 3, 4], answer: 3,
              storyZh: '小熊想把蘋果裝盤。2 顆蘋果加上 1 顆，總共是幾顆呢？', storyEn: '2 apples plus 1 apple equals how many?' },
            { id: 2, fruit: '🥭', type: '+', a: 3, b: 2, options: [4, 5, 6], answer: 5,
              storyZh: '好香的芒果！3 顆芒果再加上 2 顆，總共是幾顆呢？', storyEn: '3 mangoes plus 2 mangoes equals how many?' },
            { id: 3, fruit: '🍒', type: '-', a: 5, b: 2, options: [2, 3, 4], answer: 3,
              storyZh: '媽媽拿走了一串櫻桃。5 串櫻桃減掉 2 串，還剩下幾串？', storyEn: '5 cherries minus 2 cherries equals how many left?' },
            { id: 4, fruit: '🍋', type: '-', a: 4, b: 1, options: [1, 2, 3], answer: 3,
              storyZh: '小熊做了一杯檸檬汁。4 顆檸檬用掉 1 顆，還剩下幾顆？', storyEn: '4 lemons minus 1 lemon equals how many left?' }
        ];

        const COLORS = [
            { zh: '紅色', en: 'Red', code: '#FF3D00' }, { zh: '黃色', en: 'Yellow', code: '#FFD600' },
            { zh: '綠色', en: 'Green', code: '#4CAF50' }, { zh: '藍色', en: 'Blue', code: '#2196F3' },
            { zh: '橘色', en: 'Orange', code: '#FF9800' }, { zh: '紫色', en: 'Purple', code: '#9C27B0' }
        ];

        const App = () => {
            const [hasStarted, setHasStarted] = useState(false);
            const [gameStage, setGameStage] = useState('color'); // color -> count -> math -> end
            const [levelIdx, setLevelIdx] = useState(0);
            const [coverage, setCoverage] = useState(0);
            const [isCompleted, setIsCompleted] = useState(false);
            const [isDrawing, setIsDrawing] = useState(false);
            const [selectedColor, setSelectedColor] = useState(null);
            const [pointerPos, setPointerPos] = useState(null);
            const [isFlipping, setIsFlipping] = useState(false);
            const [isMuted, setIsMuted] = useState(false);
            
            const [basketCount, setBasketCount] = useState(0);
            const [droppedFruits, setDroppedFruits] = useState([]); 

            const canvasRef = useRef(null);
            const maskCanvasRef = useRef(null);
            const ctxRef = useRef(null);
            const audioRef = useRef(null);
            const lastPos = useRef({ x: 0, y: 0 });

            const currentColorLevel = COLOR_LEVELS[levelIdx];
            const currentCountLevel = COUNT_LEVELS[levelIdx];
            const currentMathLevel = MATH_LEVELS[levelIdx];

            let currentGlobalPage = 1;
            if (gameStage === 'color') currentGlobalPage = levelIdx + 1;
            else if (gameStage === 'count') currentGlobalPage = COLOR_LEVELS.length + levelIdx + 1;
            else if (gameStage === 'math') currentGlobalPage = COLOR_LEVELS.length + COUNT_LEVELS.length + levelIdx + 1;
            const totalPages = COLOR_LEVELS.length + COUNT_LEVELS.length + MATH_LEVELS.length;

            useEffect(() => {
                audioRef.current = new Audio('https://assets.mixkit.co/music/preview/mixkit-happy-times-158.mp3');
                audioRef.current.loop = true;
                audioRef.current.volume = 0.15; 
                window.speechSynthesis.getVoices();
            }, []);

            const toggleMute = () => {
                if (audioRef.current) {
                    audioRef.current.muted = !isMuted;
                    setIsMuted(!isMuted);
                }
            };

            // 【聲音恢復正常】移除了不自然的 pitch 和 rate
            const speakBilingual = (zhText, enText) => {
                if ('speechSynthesis' in window) {
                    if (window.__zhUtterance) window.__zhUtterance.onend = null;
                    window.speechSynthesis.cancel();
                    
                    const zhUtterance = new SpeechSynthesisUtterance(zhText);
                    zhUtterance.lang = 'zh-TW'; 
                    window.__zhUtterance = zhUtterance; 

                    const enUtterance = new SpeechSynthesisUtterance(enText);
                    enUtterance.lang = 'en-US'; 

                    zhUtterance.onend = () => { if (enText) window.speechSynthesis.speak(enUtterance); };
                    window.speechSynthesis.speak(zhUtterance);
                }
            };

            const speakQuestion = () => {
                if (!hasStarted) return;
                if (gameStage === 'color') speakBilingual(`${currentColorLevel.storyZh} 你能幫小熊畫上正確的顏色嗎？`, `${currentColorLevel.storyEn} Can you help Little Bear color it?`);
                else if (gameStage === 'count') speakBilingual(currentCountLevel.storyZh, currentCountLevel.storyEn);
                else if (gameStage === 'math') speakBilingual(currentMathLevel.storyZh, currentMathLevel.storyEn);
                else if (gameStage === 'end') speakBilingual('熊媽媽非常開心小熊完成了所有的任務！她送給小熊一台玩具小汽車作為獎勵！', 'Mama Bear is very happy that Little Bear completed all the tasks! She gave him a toy car as a reward!');
            };

            const initCanvas = () => {
                if (gameStage !== 'color' || !canvasRef.current) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctxRef.current = ctx; ctx.clearRect(0, 0, 200, 200);
                const mCanvas = document.createElement('canvas');
                mCanvas.width = 200; mCanvas.height = 200;
                maskCanvasRef.current = mCanvas;
                const mCtx = mCanvas.getContext('2d');
                mCtx.clearRect(0, 0, 200, 200);
                mCtx.fillStyle = '#000000';
                mCtx.fill(new Path2D(currentColorLevel.path));
            };

            useEffect(() => {
                if (!hasStarted) return;
                if (gameStage === 'color') { initCanvas(); setCoverage(0); }
                else if (gameStage === 'count') { setBasketCount(0); setDroppedFruits([]); }
                setIsCompleted(false); setSelectedColor(null); 
                const timer = setTimeout(() => { speakQuestion(); }, 400);
                return () => clearTimeout(timer);
            }, [levelIdx, gameStage, hasStarted]);

            const handleNextLevel = () => {
                if (isFlipping) return;
                setIsFlipping(true);
                setTimeout(() => {
                    if (gameStage === 'color') {
                        if (levelIdx + 1 < COLOR_LEVELS.length) setLevelIdx(levelIdx + 1);
                        else { setGameStage('count'); setLevelIdx(0); }
                    } else if (gameStage === 'count') {
                        if (levelIdx + 1 < COUNT_LEVELS.length) setLevelIdx(levelIdx + 1);
                        else { setGameStage('math'); setLevelIdx(0); }
                    } else if (gameStage === 'math') {
                        if (levelIdx + 1 < MATH_LEVELS.length) setLevelIdx(levelIdx + 1);
                        else setGameStage('end');
                    }
                    setIsFlipping(false);
                }, 300);
            };

            // 【手動送出答案】移除自動過關判定，讓小朋友自由點擊
            const handleFruitClick = (index) => {
                if (isCompleted || droppedFruits.includes(index)) return;
                const nextCount = basketCount + 1;
                setDroppedFruits([...droppedFruits, index]);
                setBasketCount(nextCount);
                speakBilingual(`${nextCount}`, `${nextCount}`);
            };

            // 確認按鈕邏輯
            const handleConfirmCount = () => {
                if (basketCount === currentCountLevel.targetCount) {
                    setIsCompleted(true);
                    speakBilingual(`太棒了！小熊成功買到了 ${currentCountLevel.targetCount} 顆${currentCountLevel.objectName.zh}！可以翻頁囉！`, `Great! Little Bear got ${currentCountLevel.targetCount} ${currentCountLevel.objectName.en}! Let's turn the page!`);
                } else {
                    speakBilingual(`數量好像不對喔，小熊需要 ${currentCountLevel.targetCount} 顆，再算算看！`, `The number is not quite right, try counting again!`);
                }
            };

            const handleMathClick = (opt) => {
                if (isCompleted) return;
                if (opt === currentMathLevel.answer) {
                    setIsCompleted(true);
                    speakBilingual(`太聰明了！答案就是 ${opt}！可以翻到下一頁囉！`, `Very smart! The answer is ${opt}! Let's go to the next page!`);
                } else {
                    speakBilingual("哎呀，好像不對喔！再算算看！", "Oops, that's not right! Try again!");
                }
            };

            const renderLevelDetails = (id) => {
                switch(id) {
                    case 1: return (
                        <g fill="none" stroke="#2D3436" strokeWidth="2.5">
                            <path d="M 100 50 Q 105 30 115 25" stroke="#795548" strokeWidth="4" strokeLinecap="round" />
                            <path d="M 110 35 Q 130 25 135 45 Q 115 50 110 35" fill="#4CAF50" />
                            <path d="M 60 100 C 65 80 80 70 90 70" stroke="#FFF" strokeWidth="3" opacity="0.6" strokeLinecap="round" />
                        </g>
                    );
                    case 2: return (
                        <g fill="none" stroke="#2D3436" strokeWidth="2" opacity="0.3">
                            <path d="M100 20 L100 175" /><path d="M100 60 L135 85 M100 95 L140 120 M100 130 L135 155" />
                            <path d="M100 60 L65 85 M100 95 L60 120 M100 130 L65 155" />
                        </g>
                    );
                    case 3: return (
                        <g fill="none" stroke="#2D3436" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                            <path d="M 165 105 Q 170 95 175 100 Q 175 110 160 115 Z" fill="#4CAF50" strokeWidth="2" />
                            <path d="M 55 125 C 85 150 130 150 165 105" opacity="0.3" strokeWidth="2" />
                            <path d="M 45 145 L 35 150 L 40 135" fill="#2D3436" />
                        </g>
                    );
                    case 4: return (
                        <g fill="none" stroke="#2D3436" strokeWidth="2.5">
                            <path d="M100 35 Q100 15 85 10" stroke="#795548" strokeWidth="4" strokeLinecap="round" />
                            <path d="M90 25 Q65 15 60 35 Q80 40 90 25" fill="#4CAF50" />
                            <circle cx="100" cy="35" r="2.5" fill="#2D3436" />
                            <path d="M140 70 C150 80 155 100 145 110" stroke="#FFF" strokeWidth="4" strokeLinecap="round" opacity="0.5"/>
                            <circle cx="70" cy="100" r="1.5" fill="#2D3436" opacity="0.3" />
                            <circle cx="85" cy="140" r="1.5" fill="#2D3436" opacity="0.3" />
                            <circle cx="130" cy="120" r="1.5" fill="#2D3436" opacity="0.3" />
                        </g>
                    );
                    case 5: return (
                        <g fill="none" stroke="#2D3436" strokeWidth="2.5">
                            <path d="M 100 65 V 45" stroke="#795548" strokeWidth="4" strokeLinecap="round" />
                            <path d="M 100 55 Q 120 45 125 60 Q 105 65 100 55" fill="#4CAF50" />
                            <circle cx="85" cy="85" r="14" /> <circle cx="115" cy="85" r="14" />
                            <circle cx="75" cy="110" r="14" /> <circle cx="125" cy="110" r="14" />
                            <circle cx="85" cy="135" r="14" /> <circle cx="115" cy="135" r="14" />
                            <circle cx="100" cy="75" r="14" /> <circle cx="100" cy="100" r="14" />
                            <circle cx="100" cy="125" r="14" /> <circle cx="100" cy="150" r="14" />
                        </g>
                    );
                    default: return null;
                }
            };

            const getPos = (e) => {
                const rect = canvasRef.current.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: (clientX - rect.left) * (200 / rect.width), y: (clientY - rect.top) * (200 / rect.height) };
            };
            const drawSegment = (x1, y1, x2, y2) => {
                const ctx = ctxRef.current;
                ctx.save(); ctx.beginPath(); ctx.clip(new Path2D(currentColorLevel.path)); 
                ctx.globalAlpha = 0.85; ctx.lineWidth = 26; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                ctx.strokeStyle = selectedColor.code;
                ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore();
            };
            const handleStart = (e) => {
                if (isCompleted) return;
                if (!selectedColor) { speakBilingual("請先幫小熊選一個彩筆喔！", "Please choose a color!"); return; }
                if (!currentColorLevel.targetColors.includes(selectedColor.code)) {
                    // 防呆機制：開始畫的時候如果選錯顏色也提醒
                    speakBilingual(`哎呀，這不是對的顏色喔！`, `Oops, not this color!`); return;
                }
                setIsDrawing(true); const pos = getPos(e); lastPos.current = pos; setPointerPos(pos); drawSegment(pos.x, pos.y, pos.x, pos.y);
            };
            const handleMove = (e) => {
                if (!isDrawing) return; const pos = getPos(e); drawSegment(lastPos.current.x, lastPos.current.y, pos.x, pos.y);
                lastPos.current = pos; setPointerPos(pos);
            };
            const handleEnd = () => {
                if (!isDrawing) return; setIsDrawing(false); setPointerPos(null);
                const drawData = ctxRef.current.getImageData(0,0,200,200).data;
                const maskData = maskCanvasRef.current.getContext('2d').getImageData(0,0,200,200).data;
                let totalPixels = 0, coloredPixels = 0;
                for (let i = 0; i < maskData.length; i += 4) {
                    if (maskData[i+3] > 0) { totalPixels++; if (drawData[i+3] > 50) coloredPixels++; }
                }
                const percent = totalPixels > 0 ? (coloredPixels / totalPixels) * 100 : 0;
                setCoverage(percent);
                if (percent >= 65 && !isCompleted) {
                    setIsCompleted(true);
                    speakBilingual(`太棒了！完美的${selectedColor.zh}${currentColorLevel.objectName.zh}！可以翻頁囉！`, `Wonderful! A perfect ${selectedColor.en} ${currentColorLevel.objectName.en}!`);
                }
            };

            return (
                <div className="w-full flex flex-col items-center p-2 font-sans select-none relative">
                    <button onClick={toggleMute} className="fixed top-4 right-4 z-50 bg-white/90 p-3 rounded-full shadow-md text-2xl hover:bg-gray-100 transition-colors border-2 border-amber-200 cursor-pointer" title={isMuted ? "播放背景音樂" : "暫停背景音樂"}>
                        {isMuted ? '🔇' : '🎵'}
                    </button>

                    {!hasStarted ? (
                        <div className="flex items-center justify-center p-4 font-sans mt-10">
                            <div className="bg-white p-8 rounded-[32px] storybook-shadow text-center max-w-sm border-[10px] border-[#D1A153] animate-pop-in relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-full h-32 bg-amber-50 -z-10 rounded-b-full"></div>
                                <div className="text-[80px] mb-2 drop-shadow-md">🐻</div>
                                <h1 className="text-3xl font-black text-amber-900 mb-4 tracking-wider">雙語互動繪本</h1>
                                <div className="bg-amber-500 text-white text-xl font-bold py-1 px-4 rounded-full inline-block mb-4">幫小熊買水果</div>
                                <p className="text-gray-600 font-bold text-base mb-8 leading-relaxed">小熊媽媽請小熊去買水果，<br/>但他不太會認顏色和數數...<br/><span className="text-amber-600">你可以翻開書本幫幫他嗎？</span></p>
                                <button onClick={() => { setHasStarted(true); if(audioRef.current) audioRef.current.play().catch(e => console.log(e)); }} className="bg-amber-600 text-white text-lg font-black py-4 px-8 rounded-2xl shadow-[0_5px_0_#78350f] hover:bg-amber-500 active:translate-y-[4px] active:shadow-none transition-all w-full cursor-pointer">
                                    📖 翻開繪本 ➔
                                </button>
                            </div>
                        </div>
                    ) : gameStage === 'end' ? (
                        <div className="flex items-center justify-center p-4 font-sans mt-10">
                            <div className="bg-white p-8 rounded-[32px] storybook-shadow text-center max-w-md border-[10px] border-[#D1A153] animate-pop-in relative overflow-hidden">
                                <div className="text-[70px] mb-2 drop-shadow-md">🎉 🚗 🐻</div>
                                <h1 className="text-3xl font-black text-green-600 mb-4 tracking-wider">快樂的大結局</h1>
                                <p className="text-gray-700 font-bold text-lg mb-3 leading-relaxed">熊媽媽非常開心小熊完成了所有任務！<br/><span className="text-rose-500">她送給小熊一台玩具小汽車作為獎勵！</span></p>
                                <p className="font-en-storybook text-base font-medium text-gray-400 italic mb-8">Mama Bear is very happy that Little Bear completed all the tasks! She gave him a toy car as a reward!</p>
                                <button onClick={() => { setGameStage('color'); setLevelIdx(0); }} className="bg-green-600 text-white text-lg font-black py-4 px-8 rounded-2xl shadow-[0_5px_0_#166534] hover:bg-green-500 active:translate-y-[4px] active:shadow-none transition-all w-full cursor-pointer">
                                    🔄 重讀故事繪本
                                </button>
                            </div>
                        </div>
                    ) : (
                        <div className="w-full max-w-5xl flex flex-col items-center">
                            <header className="w-full max-w-2xl flex items-center justify-center bg-amber-600 text-white py-2 px-6 rounded-2xl shadow-md mb-6">
                                <h1 className="font-bold text-lg tracking-wider flex items-center gap-2">
                                    {gameStage === 'color' && '🖍️ 小熊的任務：認顏色'}
                                    {gameStage === 'count' && '🧺 小熊的任務：採收水果'}
                                    {gameStage === 'math' && '🧮 小熊的任務：水果算數'}
                                </h1>
                            </header>

                            <div className={`w-full bg-[#FCF8EE] rounded-[24px] storybook-shadow border-4 border-[#B8862B] relative flex flex-col md:flex-row overflow-hidden transition-transform duration-500 ${isFlipping ? 'animate-page-flip' : ''}`}>
                                <div className="absolute top-0 bottom-0 left-1/2 w-[3px] bg-gradient-to-r from-black/10 via-black/20 to-transparent z-30 hidden md:block" />
                                <div className="absolute top-0 bottom-0 left-1/2 w-[15px] -translate-x-1/2 bg-gradient-to-r from-black/5 via-transparent to-black/5 z-30 hidden md:block" />

                                <div className="w-full md:w-1/2 p-6 md:p-8 flex flex-col justify-between bg-[#FDFBF7] relative border-b-2 md:border-b-0 md:border-r border-amber-100/60">
                                    <div className="text-xs font-bold text-amber-800/40 font-en-storybook mb-4">PAGE {currentGlobalPage} OF {totalPages}</div>
                                    <div className="flex-1 flex flex-col justify-center items-center my-4 text-center">
                                        <div className="text-5xl mb-3 animate-bounce">🐻👩</div>
                                        <div className="bg-amber-50 border-2 border-amber-200 rounded-3xl p-5 shadow-sm relative max-w-sm">
                                            <h2 className="text-lg md:text-xl font-black text-gray-800 tracking-wider leading-relaxed">
                                                {gameStage === 'color' && currentColorLevel.storyZh}
                                                {gameStage === 'count' && currentCountLevel.storyZh}
                                                {gameStage === 'math' && currentMathLevel.storyZh}
                                            </h2>
                                            <p className="font-en-storybook text-sm font-medium text-amber-700/60 italic mt-2 px-2">
                                                {gameStage === 'color' && currentColorLevel.storyEn}
                                                {gameStage === 'count' && currentCountLevel.storyEn}
                                                {gameStage === 'math' && currentMathLevel.storyEn}
                                            </p>
                                            <button onClick={speakQuestion} className="absolute -right-3 -top-3 text-xl bg-white hover:bg-amber-100 p-2 rounded-full border border-amber-200 shadow-md transition-transform active:scale-90 cursor-pointer">🔊</button>
                                        </div>
                                    </div>

                                    <div className="mt-4">
                                        {gameStage === 'color' && (
                                            <div className="bg-white/80 rounded-2xl p-3 border border-amber-100 shadow-inner">
                                                <div className="flex justify-center flex-wrap gap-2">
                                                    {COLORS.map(c => (
                                                        <button key={c.code} 
                                                            // 【點選彩筆時的錯誤語音判斷】
                                                            onClick={() => { 
                                                                setSelectedColor(c); 
                                                                if (currentColorLevel.targetColors.includes(c.code)) {
                                                                    speakBilingual(c.zh + "！答對了！", c.en + "! Correct!"); 
                                                                } else {
                                                                    speakBilingual(`哎呀，這不是對的顏色喔！`, `Oops, that's not the right color!`);
                                                                }
                                                            }}
                                                            className={`flex flex-col items-center transition-all w-11 ${selectedColor?.code === c.code ? 'scale-110 -translate-y-1' : 'opacity-60 hover:opacity-100 cursor-pointer'}`}>
                                                            <div className="w-8 h-10 rounded-t-md rounded-b-xl border-2 border-white shadow-md" style={{backgroundColor: c.code}} />
                                                            <span className="text-xs font-black mt-1 text-gray-600">{c.zh}</span>
                                                        </button>
                                                    ))}
                                                </div>
                                                <div className="flex items-center gap-2 mt-3 bg-amber-50/50 p-2 rounded-xl text-xs">
                                                    <span className="font-bold text-amber-800 shrink-0">進度:</span>
                                                    <div className="flex-1 h-3 bg-gray-200 rounded-full overflow-hidden border border-gray-300">
                                                        <div className="h-full bg-green-400 transition-all duration-300" style={{width: `${Math.min(100, (coverage/65)*100)}%`}}></div>
                                                    </div>
                                                    <button onClick={() => { initCanvas(); setCoverage(0); setIsCompleted(false); }} className="bg-red-100 text-red-600 px-2 py-1 rounded font-bold hover:bg-red-200 cursor-pointer">🔄</button>
                                                </div>
                                            </div>
                                        )}
                                        {gameStage === 'count' && (
                                            // 【新增按確認送出答案的UI】
                                            <div className="flex flex-col gap-2">
                                                <div className="flex gap-2 justify-center">
                                                    <button onClick={() => { setBasketCount(0); setDroppedFruits([]); setIsCompleted(false); }} className="flex-1 inline-flex items-center justify-center gap-1 bg-amber-100 text-amber-800 text-sm font-black py-2.5 rounded-xl hover:bg-amber-200 transition-all cursor-pointer">
                                                        🔄 清空重採
                                                    </button>
                                                    <button onClick={handleConfirmCount} disabled={isCompleted} className={`flex-1 inline-flex items-center justify-center gap-1 text-white text-sm font-black py-2.5 rounded-xl transition-all shadow-md cursor-pointer ${isCompleted ? 'bg-gray-300 shadow-none pointer-events-none' : 'bg-green-500 hover:bg-green-600 active:translate-y-1'}`}>
                                                        ✔️ 確認數量
                                                    </button>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>

                                <div className="w-full md:w-1/2 p-6 md:p-8 flex flex-col justify-between items-center bg-[#FDFDFB] relative">
                                    <div className="w-full h-8 flex justify-center items-center mb-2">
                                        {isCompleted && (
                                            <div className="bg-green-100 text-green-700 font-black px-4 py-1 rounded-full text-sm animate-pop-in border border-green-300 shadow-sm">
                                                ✨ 任務完成！請點選右下角翻頁 ➔
                                            </div>
                                        )}
                                    </div>

                                    <div className="relative w-full aspect-square max-w-[280px] bg-white rounded-[24px] border-4 border-amber-100/80 shadow-md overflow-hidden flex items-center justify-center p-0">
                                        {gameStage === 'color' && (
                                            <div className="relative w-[200px] h-[200px] flex items-center justify-center touch-none">
                                                <svg viewBox="0 0 200 200" className="absolute inset-0 w-full h-full pointer-events-none z-10">
                                                    <path d={currentColorLevel.path} fill="#FAFAFA" stroke="#EAEAEA" strokeWidth="1" />
                                                </svg>
                                                <div className="absolute inset-0 w-full h-full" style={{ clipPath: `path('${currentColorLevel.path}')`, WebkitClipPath: `path('${currentColorLevel.path}')`, zIndex: 20 }}>
                                                    <canvas ref={canvasRef} width="200" height="200" onMouseDown={handleStart} onMouseMove={handleMove} onMouseUp={handleEnd} onMouseLeave={handleEnd} onTouchStart={handleStart} onTouchMove={handleMove} onTouchEnd={handleEnd} className="absolute inset-0 w-full h-full cursor-crosshair" />
                                                </div>
                                                {isDrawing && pointerPos && ( <div className="absolute pointer-events-none z-50 text-3xl" style={{ left: `${(pointerPos.x / 200) * 100}%`, top: `${(pointerPos.y / 200) * 100}%`, transform: 'translate(-10%, -90%)' }}>🖌️</div> )}
                                                
                                                <svg viewBox="0 0 200 200" className="absolute inset-0 w-full h-full pointer-events-none" style={{ zIndex: 30 }}>
                                                    {currentColorLevel.id !== 5 && <path d={currentColorLevel.path} fill="none" stroke="#2D3436" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />}
                                                    {renderLevelDetails(currentColorLevel.id)}
                                                </svg>
                                            </div>
                                        )}

                                        {gameStage === 'count' && (
                                            <div className="relative w-full h-full p-2 flex flex-col justify-between items-center overflow-hidden">
                                                <div className="relative w-full h-[55%]">
                                                    <svg viewBox="0 0 200 120" className="absolute inset-0 w-full h-full pointer-events-none opacity-95">
                                                        <path d="M 92,80 L 108,80 L 112,120 L 88,120 Z" fill="#8B5A2B" />
                                                        <circle cx="65" cy="50" r="35" fill="#1E5631" /><circle cx="135" cy="50" r="35" fill="#1E5631" /><circle cx="100" cy="40" r="40" fill="#4C9A2A" />
                                                    </svg>
                                                    {currentCountLevel.positions.map((pos, idx) => {
                                                        const isPicked = droppedFruits.includes(idx);
                                                        return (
                                                            <button key={idx} onClick={() => handleFruitClick(idx)}
                                                                className={`absolute text-3xl p-1 transition-all duration-500 z-10 ${isPicked ? 'pointer-events-none opacity-0 scale-50' : 'hover:scale-110 cursor-pointer animate-pulse'}`}
                                                                style={{ left: `${pos.x}%`, top: `${pos.y}%` }}>
                                                                {currentCountLevel.emoji}
                                                            </button>
                                                        );
                                                    })}
                                                </div>

                                                <div className="relative w-[85%] h-[40%] mb-2 flex items-center justify-center">
                                                    <div className="absolute inset-0 z-10 flex flex-wrap items-center justify-center px-4 py-2 gap-1 pointer-events-none">
                                                        {droppedFruits.map((fIdx, i) => {
                                                            const rot = (i * 13) % 30 - 15;
                                                            return (
                                                                <span key={fIdx} className="text-2xl animate-pop-in inline-block" style={{ transform: `rotate(${rot}deg)` }}>
                                                                    {currentCountLevel.emoji}
                                                                </span>
                                                            );
                                                        })}
                                                    </div>
                                                    <div className="absolute inset-0 z-20 pointer-events-none overflow-hidden rounded-b-2xl rounded-t-md bg-amber-900/5">
                                                        <div className="absolute -top-5 left-1/2 -translate-x-1/2 w-16 h-8 border-4 border-[#8B4513] rounded-t-full" />
                                                        <div className="absolute inset-0 border-4 border-[#8B4513] rounded-b-2xl rounded-t-md shadow-[inset_0_-8px_15px_rgba(0,0,0,0.1)]" />
                                                        <svg width="100%" height="100%" className="opacity-40">
                                                            <pattern id="weave" width="14" height="14" patternUnits="userSpaceOnUse">
                                                                <path d="M0,7 L14,7 M7,0 L7,14" stroke="#8B4513" strokeWidth="2" fill="none" />
                                                            </pattern>
                                                            <rect width="100%" height="100%" fill="url(#weave)" />
                                                        </svg>
                                                    </div>
                                                    <div className="absolute bottom-1 right-2 bg-[#8B4513] text-white text-xs font-black px-2 py-0.5 rounded-full z-30 shadow-sm">
                                                        {basketCount}
                                                    </div>
                                                </div>
                                            </div>
                                        )}

                                        {gameStage === 'math' && (
                                            <div className="w-full h-full flex flex-col items-center justify-center bg-green-50/50 relative px-2">
                                                <div className="flex items-center text-2xl md:text-3xl gap-2 font-black text-gray-700 mt-2">
                                                    <div className="flex gap-1 flex-wrap justify-center bg-amber-50 p-2 md:p-3 rounded-2xl border-2 border-amber-200 shadow-sm w-auto max-w-[140px] min-w-[50px]">
                                                        {Array.from({length: currentMathLevel.a}).map((_,i) => <span key={i} className="text-2xl leading-none">{currentMathLevel.fruit}</span>)}
                                                    </div>
                                                    <span>{currentMathLevel.type}</span>
                                                    <div className="flex gap-1 flex-wrap justify-center bg-amber-50 p-2 md:p-3 rounded-2xl border-2 border-amber-200 shadow-sm w-auto max-w-[140px] min-w-[50px]">
                                                        {Array.from({length: currentMathLevel.b}).map((_,i) => <span key={i} className="text-2xl leading-none">{currentMathLevel.fruit}</span>)}
                                                    </div>
                                                    <span>=</span>
                                                    <div className="flex gap-1 flex-wrap justify-center bg-white p-2 rounded-2xl border-2 border-dashed border-amber-400 min-w-[60px] min-h-[50px] items-center">
                                                        {isCompleted ? (
                                                            Array.from({length: currentMathLevel.answer}).map((_,i) => <span key={i} className="text-2xl animate-pop-in leading-none">{currentMathLevel.fruit}</span>)
                                                        ) : (
                                                            <span className="text-2xl opacity-40">?</span>
                                                        )}
                                                    </div>
                                                </div>

                                                <div className="flex gap-3 md:gap-4 mt-8 z-20">
                                                    {currentMathLevel.options.map(opt => (
                                                        <button key={opt} onClick={() => handleMathClick(opt)} disabled={isCompleted}
                                                            className={`w-14 h-14 md:w-16 md:h-16 text-2xl md:text-3xl font-black rounded-2xl shadow-[0_5px_0_#d97706] transition-all cursor-pointer
                                                            ${isCompleted && opt === currentMathLevel.answer ? 'bg-green-400 text-white shadow-[0_5px_0_#16a34a] scale-110 animate-bounce' : 'bg-amber-400 text-white hover:bg-amber-300 active:translate-y-1 active:shadow-none'}
                                                            ${isCompleted && opt !== currentMathLevel.answer ? 'opacity-30 grayscale shadow-none translate-y-1' : ''}
                                                            `}>
                                                            {opt}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>
                                        )}

                                        {isCompleted && <Confetti />}
                                    </div>

                                    <div className="w-full flex justify-end mt-4">
                                        <button onClick={handleNextLevel} disabled={!isCompleted}
                                            className={`py-3 px-6 rounded-xl font-black text-base flex justify-center items-center gap-2 transition-all shadow-md cursor-pointer ${isCompleted ? 'bg-green-500 text-white hover:bg-green-600 animate-bounce' : 'bg-gray-100 text-gray-400 pointer-events-none shadow-none'}`}>
                                            下一頁 ➔
                                        </button>
                                    </div>

                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
